name: Deploy production

# Production deploys only from here, after CI passes on main and migrations
# have run. vercel.json turns off Vercel's own deploys for main; pull requests
# still get Vercel preview deployments.
#
# Turn on by adding the secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# and MONGODB_URI (to the "make-my-marriage" environment or the repository),
# then the REPOSITORY variable DEPLOY_ENABLED=true: the job's `if` runs before
# the environment loads, so an environment variable can't switch it on (see
# README, "Deploying").

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    environment: make-my-marriage
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://make-my-marriage.vercel.app' }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      # Fail in seconds, with the name of what's missing, instead of halfway
      # through a migration or a Vercel command.
      - name: Check deploy settings
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          [ -n "$MONGODB_URI" ] || missing="$missing MONGODB_URI"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (README, Deploying)"
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run database migrations
        run: npm run db:migrate
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'mmm' }}

      # Vercel builds this commit on its own servers. A local `vercel build`
      # can't be used: `vercel pull` returns Sensitive variables (the database
      # string and secrets) as empty values, which fails the env check.
      - name: Build and deploy on Vercel
        run: npx vercel@64.7.0 deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # The site must answer and reach the database. A failure here means the
      # new version is live but unhealthy: check the Vercel logs, then promote
      # the previous deployment in Vercel if needed.
      - name: Check the live site
        run: |
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 20 "$PRODUCTION_URL/api/health" || true)
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "Healthy: $PRODUCTION_URL"
              exit 0
            fi
            echo "Attempt $attempt: not healthy yet ($body)"
            sleep 10
          done
          echo "::error::$PRODUCTION_URL/api/health did not report ok"
          exit 1
