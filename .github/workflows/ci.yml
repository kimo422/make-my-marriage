name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-24.04
    env:
      # Placeholder values: they only need to pass env validation. Tests use an
      # in-memory MongoDB and never reach Atlas.
      APP_URL: http://localhost:3000
      MONGODB_URI: mongodb://127.0.0.1:27017
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-anything-real
      TOKEN_SECRET: ci-placeholder-token-secret-not-used-for-anything
      NEXT_TELEMETRY_DISABLED: 1
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Clear message for the known Windows lockfile gap before npm ci rejects it.
      - run: node scripts/check-lockfile.mjs

      - run: npm ci

      - name: Cache the MongoDB test binary
        uses: actions/cache@v6
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Check commit messages
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
